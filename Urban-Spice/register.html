<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Urban Spice</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { charcoal:'#14110F', espresso:'#3B2A20', ivory:'#FBF8F2', cream:'#F4EEE1', gold:'#C9A24B', paprika:'#A8412B' },
      fontFamily: { display:['Fraunces','serif'], body:['Manrope','sans-serif'], mono:['JetBrains Mono','monospace'] }
    }}
  }
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="font-body antialiased">

<div class="login-shell">
  <div class="login-card">
    <a href="index.html" class="text-xs font-mono inline-flex items-center gap-1 mb-6" style="color:var(--text-muted)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Back to Urban Spice
    </a>
    <p class="eyebrow mb-4">Urban Spice</p>
    <h1 class="font-display text-3xl mb-2">Create Your Account</h1>
    <p class="text-sm mb-8" style="color:var(--text-muted)">Join Urban Spice to book faster and manage your visits.</p>

    <form id="register-form" novalidate>
      <div class="field-wrap mb-5">
        <label for="fullName" class="field-label">Full Name</label>
        <input id="fullName" name="fullName" type="text" class="field" placeholder="Your name" required autocomplete="name">
        <p id="fullName-error" class="error-msg" role="alert"></p>
      </div>
      <div class="field-wrap mb-5">
        <label for="email" class="field-label">Email</label>
        <input id="email" name="email" type="email" class="field" placeholder="you@example.com" required autocomplete="username">
        <p id="email-error" class="error-msg" role="alert"></p>
      </div>
      <div class="field-wrap mb-5">
        <label for="username" class="field-label">Username <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted)">(optional)</span></label>
        <input id="username" name="username" type="text" class="field" placeholder="Choose a username" autocomplete="username">
        <p id="username-error" class="error-msg" role="alert"></p>
      </div>
      <div class="field-wrap mb-5">
        <label for="phone" class="field-label">Phone <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted)">(optional)</span></label>
        <input id="phone" name="phone" type="tel" class="field" placeholder="+1 (555) 010-2938" autocomplete="tel">
        <p id="phone-error" class="error-msg" role="alert"></p>
      </div>
      <div class="field-wrap mb-5">
        <label for="password" class="field-label">Password</label>
        <input id="password" name="password" type="password" class="field" placeholder="At least 8 characters" required autocomplete="new-password">
        <p id="password-error" class="error-msg" role="alert"></p>
      </div>
      <div class="field-wrap mb-2">
        <label for="confirmPassword" class="field-label">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" class="field" placeholder="Re-enter your password" required autocomplete="new-password">
        <p id="confirmPassword-error" class="error-msg" role="alert"></p>
      </div>

      <p id="register-error" class="error-msg mb-4" role="alert"></p>

      <button type="submit" class="btn btn-primary w-full justify-center">Create Account</button>
    </form>

    <p class="text-sm text-center mt-6" style="color:var(--text-muted)">Already have an account? <a href="login.html" class="text-gold hover:underline">Log In</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/register.js"></script>
</body>
</html>
